services:
  server:
    environment:
      VIDEO_AI_PROVIDER: openai
      VIDEO_AI_STORYBOARD_PROVIDER: fake
      VIDEO_AI_BASE_URL: ${VIDEO_AI_BASE_URL:-http://host.docker.internal:8989/v1}
      VIDEO_AI_API_KEY_FILE: /run/secrets/model-gateway-settings.json
      VIDEO_AI_ANALYSIS_API: responses
      VIDEO_AI_ANALYSIS_MODEL: ${VIDEO_AI_ANALYSIS_MODEL:-gpt-5.6-sol}
      VIDEO_AI_REASONING_EFFORT: ${VIDEO_AI_REASONING_EFFORT:-medium}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${CLAUDE_SETTINGS_FILE:?Set CLAUDE_SETTINGS_FILE to the absolute path of settings.json}
        target: /run/secrets/model-gateway-settings.json
        read_only: true
